<script>
'use strict';
/* =====================================================================
   SERPENT SWARM - prototype
   Sections: CONFIG / UTIL+CANVAS / INPUT / POOLS+HASH / SNAKE / ENEMIES /
             WEAPONS / COLLISION / PROGRESSION / UI / GAME LOOP
   ===================================================================== */

/* ===================== CONFIG (tweak feel here) ===================== */
const CONFIG = {
  view:   { w: 320, h: 180 },          // virtual resolution
  arena:  { w: 960, h: 540, lethalBorder: true },   // lethalBorder: head touching the arena edge = defeat
  camera: { follow: 5 },               // higher = snappier camera
  snake: {
    speed: 70,            // px/s, constant
    turnRate: 240,        // deg/s max
    spacing: 6,           // px between segments along the path
    startSegs: 5,
    maxSegs: Infinity,   // no length limit (set a number, e.g. 20, to cap it)
    headR: 3.5, segR: 3,
    hitInvuln: 0.5,       // s of invulnerability after an enemy hit
    stunTime: 0.3,        // s you can't steer after biting your own body
    stunSpeed: 0.5,       // speed multiplier while stunned (never 0: freezing felt like input lag)
    stunGrace: 0.5,       // extra s before you can be stunned again
    selfSkip: 4,          // first N segments can't be bitten (the "neck")
    orbsPerSeg: 4,
    passiveSpeed: 0.10, passiveTurn: 0.15
  },
  shed:   { cooldown: 3, fuse: 1.0, radius: 20, damage: 6, shake: 4 },
  spitter:{ interval: 1.4, range: 80, boltSpeed: 160, damage: 1, boltLife: 0.5, softCap: 8, falloff: 0.8 },
  laser:  { cost: 2, cooldown: 1.0, length: 220, width: 9, damage: 12, beamLife: 0.25, shake: 3 },  // ACTIVE ability (key E / pad X): sacrifice tail segments for a piercing beam
  spike:  { hitInterval: 0.5, damage: 1 },
  mace:   { hitInterval: 0.5, damage: 2 },       // 3 Spikes fuse into a Mace
  enemy: {
    swarmerHp: 2, swarmerSpeed: 44, swarmerR: 4, speedJitter: 0.15,
    maxActive: 450,
    hpPerMinute: 0.35,       // +50% hp per 'difficulty minute'
    rampTo: 1.8,               // difficulty minutes reached when the boss arrives (run length independent)
    spawnBase: 3.2, spawnDropPerMin: 0.9, spawnMin: 0.6,   // seconds between packs
    packBase: 2, packPerMin: 3.5,
    spawnDist: 196,          // ring radius around camera (just outside the view)
    wobble: 8                // sideways wiggle so the swarm doesn't stack
  },
  boss: {
    time: 180, hp: 140, speed: 20, r: 13,          // boss arrives at 3:00 (difficulty ramp scales with this)
    blockEvery: 1.3, blockSize: 10, blockLife: 16, maxBlocks: 40,
    touchCooldown: 1.2, freeze: 0.1,
    lethal: true, wallsLethal: true,                 // DEFEAT rules: boss touching your head, or your head touching a boss wall (set false for the softer damage rules below)
    hitInvuln: 1.5,                                 // invulnerability after a boss hit (longer than a normal bite)
    touchDamage: 3,                                 // segments lost when touching the boss
    teleportEvery: 3.2, telegraph: 0.9,              // boss blinks to a new spot near you; orange ring shows where
    teleMin: 50, teleMax: 85, slamRadius: 26, slamDamage: 2
  },
  rival: {                                      // enemy snakes: hunt your head, die to any weapon, drop lots of orbs
    first: 15, every: 14, max: 4,               // first spawn (s), spawn interval (s), max alive (also capped by 1 + runTime/40)
    smartSpeed: 62, smartTurn: 150, smartHp: 1.7, smartKills: 2, smartBonusOrbs: 6,   // the SMART rival: faster/turns quicker, tougher, counts as 2 kills, drops extra orbs
    eats: false, laserOnly: false,                   // Rival Hunt rules: rivals eat orbs and grow; only the laser hurts them
    eatR: 7, eatChase: 60, eatCap: 40, eatPerSeg: 3, maxLen: 20, growHp: 6,   // eating: radius, orb-chase range, orbs remembered, orbs per new segment, max length, hp per new segment
    len: 8, hp: 24, speed: 52, turnRate: 95,    // slower and clumsier than you, so they can be out-turned
    spacing: 6, headDamage: 2, bodyDamage: 1,   // segments you lose when you touch their head / body
    recoil: 1.0, edgeMargin: 36                 // after biting they back off for this long; they steer away from the edge
  },
  orb:   { dropChance: 0.9, value: 1, magnet: 28, magnetSpeed: 130, pickR: 6, xpPerValue: 1 },
  xp:    { base: 10, mult: 1.22, cardEvery: 3 },   // xp needed = base*mult^(level-1); a card choice only every Nth level (1 = every level)
  fx:    { hitFlash: 0.08, shakeDecay: 20 },
  pools: { bolts: 600, orbs: 500, particles: 500, rings: 24, beams: 16 }
};

const C = CONFIG;
C.run = { weapons: true, boss: true, rampTime: 0, bosses: 1, swarm: true, laserFree: false, smartRivals: 0, rivalKills: 0, rivalCap: 0, orbEvery: 0, orbCap: 40 };   // boss: has a boss; rampTime: ramp seconds (0 = boss.time); bosses: how many; swarm: small enemies spawn; laserFree: laser costs no segments
/* ===================== GAME MODES =====================
   A mode is just a set of CONFIG overrides applied on top of the pristine defaults (BASE) when you pick it.
   Add a mode = add one entry here: { id, name, desc, set: { section: { key: value } } }. */
const BASE = structuredClone(CONFIG);
const MODES = [
  { id: 'classic', name: 'CLASSIC',   desc: 'SURVIVE 3:00, THEN KILL THE MINI-BOSS', set: {} },
  { id: 'rush',    name: 'BOSS RUSH', desc: 'START LONG. BOSS IN 1:00. FAST AND BRUTAL', set: { boss: { time: 60, hp: 150 }, snake: { startSegs: 14 }, rival: { first: 999 } } },
  { id: 'endless', name: 'ENDLESS',   desc: 'NO BOSS. THE SWARM NEVER STOPS GROWING', set: { run: { boss: false, rampTime: 240 }, enemy: { rampTo: 3.5 } } },
  { id: 'duel',    name: 'LASER DUEL', desc: 'INFINITE LASER. NO SWARM. KILL BOTH BOSSES', set: { run: { boss: true, bosses: 2, swarm: false, laserFree: true }, boss: { time: 2, hp: 130, teleportEvery: 4.5, blockEvery: 2.6, blockLife: 8 }, laser: { cooldown: 1.4, damage: 14 }, rival: { first: 1e9 }, snake: { startSegs: 6 } } },
  { id: 'hunt',    name: 'RIVAL HUNT', desc: 'HUNT 5 RIVALS (SMART ONE = 2). LASER ONLY', set: { run: { weapons: false, smartRivals: 1, boss: false, swarm: false, rampTime: 150, rivalKills: 5, rivalCap: 3, orbEvery: 0.7, orbCap: 45 }, rival: { first: 3, every: 6, hp: 16, speed: 55, eats: true, laserOnly: true, eatPerSeg: 2, turnRate: 105 }, laser: { cost: 1, width: 14, cooldown: 0.8 }, snake: { startSegs: 8 } } },
  { id: 'hard',    name: 'HARD',      desc: 'TOUGHER SWARM, EARLY RIVALS, ANGRY BOSS', set: { enemy: { spawnBase: 2.8, hpPerMinute: 0.45 }, rival: { first: 12, every: 11 }, boss: { hp: 170, teleportEvery: 2.6 }, orb: { dropChance: 0.85 } } },
];
let modeIdx = 0, bossList = [], rivalKills = 0, orbT = 0, rivalSpawned = 0, rivalMsg = '';
const mode = () => MODES[modeIdx];
function applyMode(i) {
  modeIdx = (i + MODES.length) % MODES.length;
  for (const k in BASE) Object.assign(CONFIG[k], structuredClone(BASE[k]));      // back to pristine defaults...
  const set = MODES[modeIdx].set;
  for (const k in set) Object.assign(CONFIG[k], set[k]);                          // ...then the mode's overrides
}
const VW = C.view.w, VH = C.view.h, AW = C.arena.w, AH = C.arena.h;
const TICK = 1 / 60;
const TAU = Math.PI * 2;
const rnd = Math.random;

const COL = {
  bg:'#171a22', out:'#0c0e13', grid:'#1d212c', border:'#3a4152', dark:'#0b0d12',
  head:'#F4FFE0', orange:'#FF8A3D', white:'#FFFFFF',
  enemy:'#8470a8', boss:'#7d4a52', rival:'#8f4a5a', rivalHead:'#c0687a', smart:'#6a4fa0', smartHead:'#b79bf0', orb:'#58D8E8', block:'#59505e', ui:'#E8ECF5', dim:'#8a93a8'
};
const WEAPONS = {
  spitter:{ color:'#B7F34A' },
  spike:  { color:'#FFB13D', fuse:'mace'  },
  laser:  { color:'#6FF0FF' },
  plain:  { color:'#5E9E3B' },                      // a bare body segment (modes without Spitters/Spikes)
  mace:   { color:'#FFE27A' }
};

/* ===================== UTIL + CANVAS ===================== */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rad = d => d * Math.PI / 180;
function angDiff(a, b) {            // shortest signed angle from a to b
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  return d;
}
const R = Math.round;

const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');
const buf = document.createElement('canvas');
buf.width = VW; buf.height = VH;
const g = buf.getContext('2d');
let scale = 1, offX = 0, offY = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  screen.width = Math.max(1, Math.floor(innerWidth * dpr));
  screen.height = Math.max(1, Math.floor(innerHeight * dpr));
  // whole-number upscale only => pixel-perfect; leftover space becomes letterbox
  scale = Math.max(1, Math.floor(Math.min(screen.width / VW, screen.height / VH)));
  offX = Math.floor((screen.width - VW * scale) / 2);
  offY = Math.floor((screen.height - VH * scale) / 2);
}
addEventListener('resize', resize);
resize();

/* ===================== INPUT ===================== */
const keys = {};          // held keys
const pressed = {};       // edge-triggered presses, consumed with took()
let clicked = null, mouse = { x: -1, y: -1 }, mouseMoved = false;
let debug = false;

addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','F3'].includes(e.code)) e.preventDefault();
  audioInit();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
  if (e.code === 'F3' && !e.repeat) debug = !debug;
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
  if (e.code === 'KeyF' && !e.repeat) toggleFullscreen();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  pauseGame();
});
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    const el = document.documentElement;
    const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
    if (p && p.then) p.then(() => { if (screen_orient() && screen_orient().lock) screen_orient().lock('landscape').catch(() => {}); }).catch(() => {});
  } catch (err) {}
}
const screen_orient = () => (window.screen && window.screen.orientation) || null;
document.addEventListener('visibilitychange', () => {
  if (!AUD.ctx) return;
  if (document.hidden) { pauseGame(); AUD.ctx.suspend(); } else AUD.ctx.resume();
});
screen.addEventListener('contextmenu', e => e.preventDefault());
function toVirtual(e) {
  const r = screen.getBoundingClientRect();
  const px = (e.clientX - r.left) * (screen.width / r.width);
  const py = (e.clientY - r.top) * (screen.height / r.height);
  return { x: (px - offX) / scale, y: (py - offY) / scale };
}
screen.addEventListener('mousemove', e => { mouse = toVirtual(e); mouseMoved = true; });
addEventListener('pointerup', () => audioInit());
screen.addEventListener('mousedown', e => { audioInit(); clicked = toVirtual(e); });

// Touch: drag anywhere = floating joystick, on-screen buttons for shed / laser / pause. Menus take taps as clicks.
const touch = { enabled: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches), id: null, sx: 0, sy: 0, ax: 0, ay: 0 };
const TB = { shed: { x: VW - 22, y: VH - 42, r: 15, label: 'SHED' }, laser: { x: VW - 56, y: VH - 30, r: 15, label: 'LASER' }, pause: { x: VW - 9, y: 27, r: 8 } };
const hitBtn = (b, v) => Math.hypot(v.x - b.x, v.y - b.y) <= b.r + 3;
screen.addEventListener('touchstart', e => {
  e.preventDefault(); audioInit(); touch.enabled = true;
  for (const t of e.changedTouches) {
    const v = toVirtual(t);
    mouse = v; mouseMoved = true;
    if (S === 'play') {
      if (hitBtn(TB.pause, v)) pressed.Escape = true;
      else if (hitBtn(TB.shed, v)) pressed.Space = true;
      else if (hitBtn(TB.laser, v)) pressed.KeyE = true;
      else if (touch.id === null) { touch.id = t.identifier; touch.sx = v.x; touch.sy = v.y; touch.ax = touch.ay = 0; }
    } else clicked = v;
  }
}, { passive: false });
screen.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== touch.id) continue;
    const v = toVirtual(t), dx = v.x - touch.sx, dy = v.y - touch.sy, len = Math.hypot(dx, dy), K = 16;
    if (len > K) { touch.sx += dx / len * (len - K); touch.sy += dy / len * (len - K); }   // stick follows the thumb
    touch.ax = len < 3 ? 0 : dx / Math.max(len, K); touch.ay = len < 3 ? 0 : dy / Math.max(len, K);
  }
}, { passive: false });
const touchEnd = e => { for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.id = null; touch.ax = touch.ay = 0; } };
screen.addEventListener('touchend', e => { audioInit(); touchEnd(e); });
screen.addEventListener('touchcancel', touchEnd);

const took = code => { if (pressed[code]) { pressed[code] = false; return true; } return false; };

const pad = { ax: 0, ay: 0, prev: [], map: { 0:'PadA', 1:'PadB', 2:'PadX', 3:'PadY', 9:'PadStart', 12:'PadUp', 13:'PadDown', 14:'PadLeft', 15:'PadRight' } };
function pollPad() {
  pad.ax = pad.ay = 0;
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of list) if (p && p.connected) { gp = p; break; }
  if (!gp) return;
  const x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (Math.hypot(x, y) > 0.3) { pad.ax = x; pad.ay = y; }
  for (const i in pad.map) {                        // rising edges -> pressed[]
    const now = !!(gp.buttons[i] && gp.buttons[i].pressed);
    if (now && !pad.prev[i]) pressed[pad.map[i]] = true;
    pad.prev[i] = now;
  }
  const b = gp.buttons;                              // d-pad also steers
  if (b[14] && b[14].pressed) pad.ax -= 1;
  if (b[15] && b[15].pressed) pad.ax += 1;
  if (b[12] && b[12].pressed) pad.ay -= 1;
  if (b[13] && b[13].pressed) pad.ay += 1;
}
const steer = { x: 0, y: 0, mag: 0 };
function readSteer() {
  if (autopilot) { steer.x = ap.x; steer.y = ap.y; steer.mag = 1; return; }   // bot drives
  let x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let y = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (x === 0 && y === 0) { x = pad.ax; y = pad.ay; }
  if (x === 0 && y === 0 && touch.id !== null) { x = touch.ax; y = touch.ay; }
  steer.x = x; steer.y = y; steer.mag = Math.hypot(x, y);
}

/* ===================== SAVE DATA (best score, volume) ===================== */
const SAVE_KEY = 'serpent-swarm-save-v1';
const save = { bestScore: 0, bestKills: 0, wins: 0, runs: 0, musicVol: 6, sfxVol: 8, muted: false, best: {}, modeId: 'classic' };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (err) {}
if (!save.best) save.best = {};
if (save.bestScore && !save.best.classic) save.best.classic = save.bestScore;   // carry over records from before modes existed
applyMode(Math.max(0, MODES.findIndex(m => m.id === save.modeId)));
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (err) {} }

/* ===================== AUDIO (everything synthesized with WebAudio: no files) ===================== */
const AUD = { ctx: null, master: null, musicBus: null, musicLP: null, sfxBus: null, noise: null, lp: 18000 };
const MUS = { track: '', step: 0, next: 0, I: 0 };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function audioInit() {                                    // browsers only allow audio after a user gesture
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended' && !document.hidden) AUD.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const c = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    AUD.master = c.createGain(); AUD.master.connect(comp); comp.connect(c.destination);
    AUD.musicLP = c.createBiquadFilter(); AUD.musicLP.type = 'lowpass'; AUD.musicLP.frequency.value = AUD.lp;
    AUD.musicBus = c.createGain(); AUD.musicBus.connect(AUD.musicLP); AUD.musicLP.connect(AUD.master);
    AUD.sfxBus = c.createGain(); AUD.sfxBus.connect(AUD.master);
    const len = c.sampleRate; AUD.noise = c.createBuffer(1, len, c.sampleRate);
    const d = AUD.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AUD.ctx = c; applyVolumes(); MUS.next = c.currentTime + 0.1;
    if (c.state === 'suspended') c.resume();
  } catch (err) { AUD.ctx = null; }
}
function applyVolumes() {
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime;
  AUD.master.gain.setTargetAtTime(save.muted ? 0 : 1, t, 0.03);
  AUD.musicBus.gain.setTargetAtTime(Math.pow(save.musicVol / 10, 2) * 1.3, t, 0.03);
  AUD.sfxBus.gain.setTargetAtTime(Math.pow(save.sfxVol / 10, 2) * 1.6, t, 0.03);
}
function toggleMute() { save.muted = !save.muted; applyVolumes(); writeSave(); toast(save.muted ? 'SOUND OFF' : 'SOUND ON'); }
function adjustVol(key, d) { save[key] = clamp(save[key] + d, 0, 10); applyVolumes(); writeSave(); sfx('move'); }

// tone: one oscillator note. o = { to: slide to freq, lp: lowpass hz, a: attack s, pad: sustain then fade }
function tone(f, t, d, type, v, bus, o) {
  const c = AUD.ctx, os = c.createOscillator(), gn = c.createGain();
  os.type = type; os.frequency.setValueAtTime(f, t);
  if (o && o.to) os.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t + d);
  let node = os;
  if (o && o.lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; os.connect(fl); node = fl; }
  const a = (o && o.a) || 0.005;
  gn.gain.setValueAtTime(0.0001, t);
  if (o && o.pad) { gn.gain.linearRampToValueAtTime(v, t + a); gn.gain.setValueAtTime(v, t + Math.max(a, d - 0.4)); gn.gain.linearRampToValueAtTime(0.0001, t + d); }
  else { gn.gain.linearRampToValueAtTime(v, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + d); }
  node.connect(gn); gn.connect(bus || AUD.sfxBus);
  os.start(t); os.stop(t + d + 0.03);
}
function noiseHit(t, d, v, ftype, freq, bus, to) {
  const c = AUD.ctx, src = c.createBufferSource(), fl = c.createBiquadFilter(), gn = c.createGain();
  src.buffer = AUD.noise; fl.type = ftype; fl.frequency.setValueAtTime(freq, t);
  if (to) fl.frequency.exponentialRampToValueAtTime(to, t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(fl); fl.connect(gn); gn.connect(bus || AUD.sfxBus);
  src.start(t, Math.random() * 0.5, d + 0.05);
}
// ---- sound effects ----
const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
let orbStep = 0, orbLastT = -9;
const SFX_GAP = { shoot: 0.07, hit: 0.05, kill: 0.04, orb: 0.03, warn: 0.4, move: 0.03, laser: 0.1, stun: 0.2 };
const SFX = {
  shoot:  t => tone(640, t, 0.07, 'square', 0.03, 0, { to: 300 }),
  hit:    t => noiseHit(t, 0.04, 0.05, 'highpass', 2500, 0),
  kill:   t => { tone(260, t, 0.1, 'triangle', 0.09, 0, { to: 70 }); noiseHit(t, 0.07, 0.06, 'lowpass', 3000, 0, 400); },
  big:    t => { tone(180, t, 0.3, 'sawtooth', 0.12, 0, { to: 40, lp: 900 }); noiseHit(t, 0.25, 0.14, 'lowpass', 2500, 0, 200); },
  orb:    t => { orbStep = (t - orbLastT < 0.6) ? Math.min(orbStep + 1, 9) : 0; orbLastT = t; tone(mtof(72 + PENT[orbStep]), t, 0.09, 'sine', 0.09, 0); },
  seg:    t => { tone(330, t, 0.12, 'square', 0.06, 0, { to: 660 }); tone(660, t + 0.08, 0.1, 'square', 0.05, 0); },
  fuse:   t => { [0, 4, 7, 12, 16].forEach((n, i) => tone(mtof(72 + n), t + i * 0.04, 0.12, 'square', 0.06, 0)); noiseHit(t, 0.2, 0.06, 'highpass', 4000, 0); },

}
function resolveBlocks() {                               // boss walls: push the head out of rectangles

    let dx = head.x - cx, dy = head.y - cy;

/* ===================== PROGRESSION (orbs, xp, cards) ===================== */
function gainOrb(v) {

    for (const s of shots) if (t >= s && t < s + 0.3) box(lerp(96, 250 - 28 * (s + 0.3), (t - s) / 0.3), y, 2, 2, '#D9FF8A');

const GUIDE = [
  { title: 'STEERING', demo: demoSteer, lines: ['WASD, ARROWS OR LEFT STICK STEER THE HEAD.', 'IT TURNS AT A FIXED RATE, SO A LONG BODY', 'CANNOT TURN ON THE SPOT. PLAN YOUR CURVES.'] },
  { title: 'EAT AND GROW', demo: demoGrow, lines: ['KILL ENEMIES TO DROP CYAN ORBS. WALK OVER THEM.', () => 'EVERY ' + C.snake.orbsPerSeg + ' ORBS ADDS A SEGMENT. NO LIMIT!', 'MORE SEGMENTS = MORE WEAPONS, BUT HARDER TO STEER.'] },
  { title: 'SPITTER', demo: demoSpitter, lines: ['LIME SQUARE. SHOOTS A BOLT AT THE NEAREST', 'ENEMY INSIDE ITS RANGE RING.', 'SLOW FIRE, SHORT-LIVED BOLTS.'] },
  { title: 'SPIKE', demo: demoSpike, lines: ['AMBER DIAMOND. HURTS ANY ENEMY TOUCHING IT,', 'AT MOST ONCE EVERY HALF SECOND PER ENEMY.', 'GREAT WHEN THE SWARM CLOSES IN.'] },

  { title: 'RIVAL SNAKES', demo: demoRival, lines: ['RED RIVAL SNAKES HUNT YOUR HEAD. THEY ARE SLOWER AND', 'TURN WIDER THAN YOU, SO YOU CAN OUT-MANOEUVRE THEM.', 'TOUCH ONE: LOSE 1 SEGMENT (ITS HEAD: 2). KILL IT FOR ORBS.'] },
  { title: 'DANGERS', demo: demoDanger, lines: ['AN ENEMY TOUCHING YOUR HEAD COSTS A TAIL SEGMENT.', 'BITING YOUR OWN BODY LOCKS YOUR STEERING BRIEFLY.', 'NO SEGMENTS LEFT = RUN OVER. THE ORANGE ARENA EDGE KILLS!'] },
  { title: 'LEVEL UPS', demo: demoCards, lines: [() => 'EVERY ' + C.xp.cardEvery + ' LEVELS YOU PICK 1 OF 3 CARDS.', 'SPITTER / SPIKE CARDS SET THE TYPE OF NEW SEGMENTS.', 'OTHER LEVELS SHOW A QUICK TIP. CARDS EXPLAIN THEMSELVES.'] },

function openGuide(from) { guideFrom = from; guidePage = 0; guideT = 0; S = 'guide'; }
function guideStep(d) {

  if (n < 0) return;
  if (n >= GUIDE.length) { S = guideFrom; return; }
  guidePage = n; guideT = 0;
}
function updateGuide(dt) {
  guideT += dt;
  if (took('ArrowRight') || took('KeyD') || took('PadRight') || took('Space') || took('Enter') || took('PadA')) guideStep(1);
  if (took('ArrowLeft') || took('KeyA') || took('PadLeft')) guideStep(-1);
  if (clicked) guideStep(clicked.x < VW / 3 ? -1 : 1);
  if (took('Escape') || took('Backspace') || took('KeyH') || took('PadB') || took('PadStart') || took('PadY')) S = guideFrom;
}

  for (let i = 0; i < GUIDE.length; i++) { g.fillStyle = i === guidePage ? COL.head : '#3a4152'; g.fillRect(VW / 2 - GUIDE.length * 4 + i * 8, 156, 5, 3); }
  textC('< > PAGE      ESC OR H: BACK', VW / 2, 168, COL.dim, 1);

/* ===================== AUTOPILOT (press B: watch a bot play) ===================== */
// A potential-field bot: sums "forces" from every hazard/attraction, steers along the result, and uses
// shed / laser / cards on its own. It only ever produces a steering vector + ability presses, exactly
// like a player would, so it's a fair test of difficulty.
let autopilot = false, apTick = 0, cardWait = 0;
const ap = { x: 1, y: 0 };
const CARD_PREF = ['turn', 'seg', 'spike', 'spitter', 'orb', 'speed'];
function autopilotThink() {
  apTick++;
  const hx = head.x, hy = head.y, dirx = Math.cos(head.ang), diry = Math.sin(head.ang);
  let fx = dirx * 0.4, fy = diry * 0.4;                    // mild forward bias => less jitter
  const push = (ex, ey, rad2, w) => {                      // repel from a point inside radius rad2
    const dx = hx - ex, dy = hy - ey, d = Math.hypot(dx, dy) || 1;
    if (d < rad2) { const k = (rad2 - d) / rad2 * w; fx += dx / d * k; fy += dy / d * k; }
  };
  // arena edge (deadly): soft margin + look-ahead pull to the centre
  const mg = 80;
  if (hx < mg) fx += (mg - hx) / mg * 4; if (hx > AW - mg) fx -= (hx - (AW - mg)) / mg * 4;
  if (hy < mg) fy += (mg - hy) / mg * 4; if (hy > AH - mg) fy -= (hy - (AH - mg)) / mg * 4;
  const px = hx + dirx * 45, py = hy + diry * 45;
  if (px < 14 || px > AW - 14 || py < 14 || py > AH - 14) {
    const cx = AW / 2 - hx, cy = AH / 2 - hy, cd = Math.hypot(cx, cy) || 1; fx += cx / cd * 5; fy += cy / cd * 5;
  }
  // enemies
  let nearThreat = 0;
  for (let i = 0; i < MAXE; i++) {
    const e = enemies[i];
    if (!e.active) continue;
    if (e.boss) {
      const dx = hx - e.x, dy = hy - e.y, d = Math.hypot(dx, dy) || 1;
      if (d < 50) { const k = (50 - d) / 50 * 6; fx += dx / d * k; fy += dy / d * k; nearThreat += k; }
      else if (d > (C.run.laserFree ? 105 : 70)) { const k = C.run.laserFree ? 1.5 : 0.8; fx -= dx / d * k; fy -= dy / d * k; }   // stay in weapon range (duel: close in and line up the laser)
      else { fx += -dy / d * 0.9; fy += dx / d * 0.9; }                          // circle the boss
      if (e.tele > 0) push(e.tx, e.ty, C.boss.slamRadius + 45, 8);               // keep clear of the landing ring
    } else if (e.owner >= 0) {
      if (C.rival.laserOnly && e.seg === 0) {                                          // hunt mode: close in to laser range, then keep away from the head
        const dx = hx - e.x, dy = hy - e.y, d = Math.hypot(dx, dy) || 1;
        if (d > 105) { fx -= dx / d * 1.6; fy -= dy / d * 1.6; } else push(e.x, e.y, 75, 3.5);
      } else push(e.x, e.y, e.seg === 0 ? 70 : 38, e.seg === 0 ? 3 : 1.5);
    }
    else push(e.x, e.y, 34, 0.9);
  }
  for (const b of blocks) {                                // boss walls are lethal: repel the head AND a look-ahead point
    const bx = b.x + b.s / 2, by = b.y + b.s / 2;
    push(bx, by, 46, 7);
    const lx = hx + dirx * 22, ly = hy + diry * 22, ddx = lx - bx, ddy = ly - by, dd = Math.hypot(ddx, ddy) || 1;
    if (dd < 30) { fx += ddx / dd * 9; fy += ddy / dd * 9; }
  }
  // own body: don't turn into it
  for (let i = C.snake.selfSkip; i < segs.length; i += 1) {
    const s = segs[i], dx = s.x - hx, dy = s.y - hy;
    if (dx * dx + dy * dy < 24 * 24 && dx * dirx + dy * diry > -4) push(s.x, s.y, 24, 2.5);
  }
  // orbs: nearest within reach
  let bo = null, bd = 120 * 120;
  for (const o of orbs) { if (!o.active) continue; const dx = o.x - hx, dy = o.y - hy, d = dx * dx + dy * dy; if (d < bd) { bd = d; bo = o; } }
  if (bo) { const dx = bo.x - hx, dy = bo.y - hy, d = Math.hypot(dx, dy) || 1; fx += dx / d * 1.3; fy += dy / d * 1.3; }
  // gentle pull toward the middle so it doesn't hug walls
  fx += (AW / 2 - hx) / AW * 0.6; fy += (AH / 2 - hy) / AH * 0.6;
  const m = Math.hypot(fx, fy) || 1; ap.x = fx / m; ap.y = fy / m;

  // abilities (checked a few times per second)
  if (apTick % 5 === 0) {
    if (laserCd <= 0 && (C.run.laserFree || segs.length > C.laser.cost + (C.rival.laserOnly ? 0 : 4))) {
      let c = 0;
      for (let i = 0; i < MAXE; i++) {
        const e = enemies[i];
        if (!e.active) continue;
        const dx = e.x - hx, dy = e.y - hy, along = dx * dirx + dy * diry;
        if (along > 0 && along < C.laser.length && Math.abs(-dx * diry + dy * dirx) < C.laser.width / 2 + e.r) c += e.boss ? 8 : e.owner >= 0 && C.rival.laserOnly ? 3 : 1;
      }
      if (c >= (C.rival.laserOnly ? 3 : 6)) doLaser();
    }
    if (shedCd <= 0 && segs.length >= 9) {
      const third = Math.floor(segs.length / 3); let c = 0;
      for (let i = 0; i < MAXE; i++) {
        const e = enemies[i];
        if (!e.active || e.owner >= 0 && false) continue;
        for (let k = segs.length - third; k < segs.length; k += 2) {
          const dx = e.x - segs[k].x, dy = e.y - segs[k].y;
          if (dx * dx + dy * dy < 26 * 26) { c++; break; }
        }
      }
      if (c >= 6) doShed();
    }
  }
}
function autopilotPickCard() {
  for (const id of CARD_PREF) { const i = cardChoices.findIndex(c => c.id === id); if (i >= 0) return i; }
  return 0;
}

function drawDebug() {
  const lines = ['FPS ' + Math.round(fps), 'ENEMIES ' + activeEnemies, 'SEGMENTS ' + segs.length,
    'BOLTS ' + bolts.filter(b => b.active).length, 'ORBS ' + orbs.filter(o => o.active).length];
  for (let i = 0; i < lines.length; i++) text(lines[i], 4, 42 + i * 7, '#FFFF66', 1);
}
const isPortrait = () => touch.enabled && innerHeight > innerWidth * 1.15;
function render() {
  if (S === 'title') drawTitle();
  else if (S === 'guide') drawGuide();
  else {
    drawWorld();
    drawHUD();
    drawTouchUI();
    if (S === 'paused') drawPause();
    else if (S === 'levelup') drawCards();
    else if (S === 'win' || S === 'lose') drawEnd();
  }
  if (toastT > 0) textC(toastMsg, VW / 2, 34, COL.head, 1);
  if (isPortrait()) {                                    // phone held upright: ask for landscape
    g.setTransform(1, 0, 0, 1, 0, 0); dim(0.92);
    textC('PLEASE ROTATE YOUR PHONE', VW / 2, 74, COL.head, 1);
    textC('THE GAME PLAYS IN LANDSCAPE', VW / 2, 86, COL.dim, 1);
  }
  if (debug) drawDebug();
  // present: whole-number upscale, nearest-neighbour, centred with letterbox bars
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(buf, 0, 0, VW, VH, offX, offY, VW * scale, VH * scale);
}

/* ===================== GAME LOOP ===================== */
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.25) dt = 0.25;                                // avoid spiral of death after tab switch
  if (dt > 0) fps += (1 / dt - fps) * 0.1;
  acc += dt;
  pollPad();
  if (!AUD.ctx) for (const k in pressed) if (pressed[k]) { audioInit(); break; }
  if (isPortrait()) pauseGame();
  musicDirector(); musicPump();
  let ran = false;
  while (acc >= TICK) { update(TICK); acc -= TICK; ran = true; }   // fixed 60 Hz simulation
  if (ran) { for (const k in pressed) pressed[k] = false; clicked = null; }
  render();
}
requestAnimationFrame(frame);
